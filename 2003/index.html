<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>AceOS 2003</title>
<link rel="icon" href="/assets/favicon.png">
<style>
  :root { --blue: #0a246a; --title1: #0058ee; --title2: #3a93ff; --task1: #245edb; --task2: #1941a5; --start1: #3c9a3c; --start2: #2c7a2c; --face: #ece9d8; --line: #aca899; --lime: #c1fd5d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px/1.35 Tahoma, Verdana, "Segoe UI", sans-serif; color: #000; user-select: none; -webkit-user-select: none; }
  body { background: linear-gradient(#2f6fd6 0%, #5ea2ee 45%, #a8d4f7 62%, #79b84a 63%, #4f9a2d 80%, #3b7d22 100%); }
  .hill { position: fixed; left: -20%; right: -20%; bottom: 30px; height: 46%; background: radial-gradient(ellipse at 40% 0%, #8fd15a 0%, #5aa833 45%, #3a7f1e 75%); border-radius: 50% 50% 0 0 / 70% 70% 0 0; }
  .cloud { position: fixed; width: 220px; height: 60px; background: rgba(255,255,255,.75); border-radius: 60px; filter: blur(6px); }
  /* boot */
  .boot { position: fixed; inset: 0; z-index: 9000; background: #000; color: #fff; display: grid; place-items: center; text-align: center; }
  .boot .logo { font: bold 34px/1 "Trebuchet MS", Tahoma, sans-serif; letter-spacing: -1px; }
  .boot .logo span { color: var(--lime); }
  .boot .logo small { display: block; font-size: 14px; font-weight: normal; color: #9fb4d8; margin-top: 6px; letter-spacing: .3em; }
  .boot .bar { width: 160px; height: 14px; border: 1px solid #555; border-radius: 3px; margin: 34px auto 0; padding: 2px; overflow: hidden; position: relative; }
  .boot .bar i { position: absolute; top: 2px; width: 30px; height: 8px; background: repeating-linear-gradient(90deg, #2f6fd6 0 8px, transparent 8px 11px); animation: slide 1.4s linear infinite; }
  @keyframes slide { from { left: -34px; } to { left: 160px; } }
  .boot p { color: #777; font-size: 11px; margin-top: 30px; }
  .welcome { position: fixed; inset: 0; z-index: 8999; background: linear-gradient(#5a7edc, #3a5fc4); display: grid; place-items: center; color: #fff; font: italic bold 40px "Trebuchet MS", Tahoma, sans-serif; text-shadow: 2px 2px 3px rgba(0,0,0,.35); transition: opacity .5s; }
  /* desktop icons */
  .icons { position: fixed; top: 10px; left: 10px; bottom: 44px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 86px); gap: 4px 8px; align-content: start; }
  .icon { width: 78px; text-align: center; color: #fff; text-shadow: 1px 1px 2px #000; cursor: pointer; padding: 4px 2px; border: 1px dotted transparent; font-size: 11px; background: none; font-family: inherit; }
  .icon:focus, .icon.sel { outline: none; border-color: #fff; background: rgba(49,106,197,.55); }
  .icon .g { display: grid; place-items: center; width: 40px; height: 40px; margin: 0 auto 4px; border-radius: 6px; font: bold 18px Tahoma, sans-serif; color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 2px 3px rgba(0,0,0,.35); }
  /* windows */
  .win { position: fixed; min-width: 260px; background: var(--face); border: 1px solid #0831d9; border-radius: 8px 8px 0 0; box-shadow: 2px 3px 14px rgba(0,0,0,.45); display: flex; flex-direction: column; z-index: 10; }
  .win.inactive .tb { background: linear-gradient(#7a96df, #a6b9ea); }
  .tb { height: 28px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; border-radius: 7px 7px 0 0; color: #fff; font: bold 13px "Trebuchet MS", Tahoma, sans-serif; text-shadow: 1px 1px 1px #0a246a;
    background: linear-gradient(var(--title2), var(--title1) 18%, #0050e0 60%, #0045c8); cursor: move; touch-action: none; }
  .tb .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tb button { width: 21px; height: 21px; border: 1px solid #fff; border-radius: 3px; background: linear-gradient(#5c93f8, #2363e0); color: #fff; font: bold 11px Tahoma, sans-serif; cursor: pointer; padding: 0; line-height: 1; }
  .tb button.x { background: linear-gradient(#e9876b, #c9431e); }
  .menu { flex: none; display: flex; gap: 12px; padding: 3px 8px; border-bottom: 1px solid #fff; box-shadow: 0 1px 0 var(--line); font-size: 11px; }
  .body { flex: 1; overflow: auto; background: #fff; margin: 0 3px 3px; border: 1px solid #7f9db9; user-select: text; -webkit-user-select: text; }
  .body.face { background: var(--face); border: 0; }
  .status { flex: none; padding: 2px 8px; font-size: 11px; border-top: 1px solid var(--line); color: #333; }
  .pad { padding: 10px 12px; }
  .btn { font: 11px Tahoma, sans-serif; padding: 3px 12px; border: 1px solid #003c74; border-radius: 3px; background: linear-gradient(#fff, #ece9d8); cursor: pointer; }
  .btn:hover { box-shadow: inset 0 0 0 2px #f8b636; }
  h4 { margin: 0 0 6px; font: bold 13px Tahoma, sans-serif; color: #1e3f8f; }
  /* explorer panes */
  .explorer { display: grid; grid-template-columns: 170px 1fr; height: 100%; }
  .side { background: linear-gradient(#7ba2e7, #6375d6); padding: 10px; }
  .side .box { background: #fff; border-radius: 4px 4px 0 0; margin-bottom: 10px; font-size: 11px; }
  .side .box b { display: block; color: #fff; background: linear-gradient(90deg, #fff 0%, #c6d3f7 100%); color: #215dc6; padding: 4px 8px; border-radius: 4px 4px 0 0; }
  .side .box div { padding: 6px 8px; background: #d6dff7; }
  .side a { color: #215dc6; display: block; margin: 2px 0; text-decoration: none; }
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding: 12px; align-content: start; }
  .file { text-align: center; font-size: 11px; color: #000; text-decoration: none; }
  .file .g { width: 40px; height: 40px; margin: 0 auto 4px; display: grid; place-items: center; border-radius: 4px; color: #fff; font: bold 14px Tahoma, sans-serif; box-shadow: 0 2px 3px rgba(0,0,0,.3); }
  .file:hover span { background: #316ac5; color: #fff; }
  /* browser */
  .addr { flex: none; display: flex; gap: 6px; align-items: center; padding: 3px 6px; border-bottom: 1px solid var(--line); font-size: 11px; }
  .addr input { flex: 1; font: 11px Tahoma, sans-serif; border: 1px solid #7f9db9; padding: 2px 4px; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  /* LimeForce */
  .lf { display: flex; flex-direction: column; height: 100%; background: #f4f8ec; }
  .lf .head { background: linear-gradient(#9ed468, #6fae37); color: #fff; padding: 8px 10px; display: flex; align-items: center; gap: 10px; font: bold 16px "Trebuchet MS", sans-serif; text-shadow: 1px 1px 1px #2d5a10; }
  .lf .head small { font: 11px Tahoma, sans-serif; opacity: .9; margin-left: auto; text-shadow: none; }
  .lf .search { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #c4d9a6; }
  .lf .search input { flex: 1; border: 1px solid #8fb35f; padding: 3px 5px; font: 12px Tahoma, sans-serif; }
  .lf table { width: 100%; border-collapse: collapse; font-size: 11px; background: #fff; }
  .lf th { text-align: left; background: linear-gradient(#fff, #e3ead7); border-bottom: 1px solid #b7c99a; padding: 3px 6px; font-weight: normal; white-space: nowrap; }
  .lf td { padding: 3px 6px; border-bottom: 1px solid #eef3e6; white-space: nowrap; }
  .lf tr.row { cursor: default; }
  .lf tr.row:hover td { background: #e6f2d3; }
  .lf tr.row.sel td { background: #316ac5; color: #fff; }
  .lf .prog { width: 90px; height: 10px; border: 1px solid #7a9a52; background: #fff; display: inline-block; vertical-align: middle; }
  .lf .prog i { display: block; height: 100%; width: 0; background: linear-gradient(#a6e06a, #5f9e2a); }
  .lf .scroll { flex: 1; overflow: auto; }
  .lf .player { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: linear-gradient(#3b3b3b, #1a1a1a); color: #c1fd5d; font: 11px "Lucida Console", Monaco, monospace; }
  .lf .player button { background: linear-gradient(#666, #333); color: #fff; border: 1px solid #000; border-radius: 3px; cursor: pointer; font-size: 11px; padding: 2px 8px; }
  .lf .player .np { flex: 1; overflow: hidden; white-space: nowrap; }
  /* IM */
  .buddies { padding: 6px 8px; font-size: 12px; }
  .buddies b { display: block; margin: 6px 0 2px; font-size: 11px; color: #333; }
  .bud { padding: 2px 4px 2px 16px; cursor: pointer; position: relative; }
  .bud::before { content: ""; position: absolute; left: 3px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #3ac43a; }
  .bud.away::before { background: #f5c400; }
  .bud:hover { background: #316ac5; color: #fff; }
  .chat { display: flex; flex-direction: column; height: 100%; }
  .chat .log { flex: 1; overflow: auto; padding: 8px; font: 13px Arial, sans-serif; background: #fff; }
  .chat .log p { margin: 0 0 6px; }
  .chat .me { color: #f00; font-weight: bold; } .chat .bot { color: #00f; font-weight: bold; }
  .chat form { display: flex; gap: 4px; padding: 4px; border-top: 1px solid var(--line); background: var(--face); }
  .chat input { flex: 1; font: 13px Arial, sans-serif; border: 1px solid #7f9db9; padding: 4px; }
  /* sweeper */
  .ms { padding: 8px; display: inline-block; background: #c0c0c0; }
  .ms .top { display: flex; justify-content: space-between; align-items: center; border: 2px inset #fff; padding: 4px; margin-bottom: 6px; }
  .ms .lcd { background: #000; color: #f00; font: bold 20px "Courier New", monospace; padding: 0 4px; min-width: 46px; text-align: right; }
  .ms .face { width: 30px; height: 30px; font-size: 18px; border: 2px outset #fff; background: #c0c0c0; cursor: pointer; padding: 0; }
  .ms .grid { display: grid; grid-template-columns: repeat(9, 24px); border: 3px inset #fff; }
  .ms .c { width: 24px; height: 24px; border: 2px outset #fff; background: #c0c0c0; font: bold 13px Tahoma, sans-serif; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ms .c.o { border: 1px solid #808080; background: #d4d4d4; cursor: default; }
  .ms .msg { font-size: 11px; margin-top: 6px; min-height: 15px; text-align: center; }
  /* notepad / form */
  .note { font: 13px "Lucida Console", Monaco, monospace; white-space: pre-wrap; padding: 8px; margin: 0; }
  .mail label { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11px; }
  .mail input, .mail textarea { font: 12px Tahoma, sans-serif; border: 1px solid #7f9db9; padding: 3px 5px; width: 100%; }
  .mail textarea { min-height: 120px; }
  .hp { position: absolute; left: -9999px; }
  /* taskbar */
  .taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 32px; z-index: 5000; display: flex; align-items: center; background: linear-gradient(#3168d5, var(--task1) 10%, #2153c6 60%, var(--task2)); border-top: 1px solid #0c32a8; }
  .start { height: 32px; padding: 0 18px 0 10px; border: 0; border-radius: 0 12px 12px 0; color: #fff; font: italic bold 17px "Trebuchet MS", Tahoma, sans-serif; text-shadow: 1px 1px 2px #1a4a1a; cursor: pointer;
    background: linear-gradient(#58b658, var(--start1) 40%, var(--start2)); box-shadow: inset -2px 0 3px rgba(0,0,0,.25); display: flex; align-items: center; gap: 6px; }
  .start .flag { width: 18px; height: 18px; border-radius: 3px; background: conic-gradient(var(--lime) 0 25%, #ffcf3d 0 50%, #3a93ff 0 75%, #ff5a3c 0); transform: skewX(-8deg); }
  .tasks { flex: 1; display: flex; gap: 3px; padding: 0 6px; overflow: hidden; }
  .task { max-width: 160px; flex: 1 1 160px; height: 24px; border-radius: 3px; border: 1px solid #1941a5; background: linear-gradient(#3c81f3, #2463e0); color: #fff; font-size: 11px; text-align: left; padding: 0 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
  .task.on { background: linear-gradient(#1e52b7, #1945a5); box-shadow: inset 1px 1px 2px rgba(0,0,0,.5); }
  .tray { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: linear-gradient(#0f8bea, #0b77d8 50%, #0a63c4); border-left: 1px solid #1042af; color: #fff; font-size: 11px; }
  .tray button { background: none; border: 0; color: #fff; cursor: pointer; font-size: 13px; padding: 0; }
  /* start menu */
  .smenu { position: fixed; left: 0; bottom: 32px; width: 380px; max-width: 100vw; z-index: 6000; background: #fff; border: 1px solid #0831d9; border-radius: 8px 8px 0 0; box-shadow: 3px 0 10px rgba(0,0,0,.4); overflow: hidden; }
  .smenu .who { display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: #fff; font: bold 14px "Trebuchet MS", sans-serif; background: linear-gradient(#1868ce, #0e60cb 50%, #0b4ab4); text-shadow: 1px 1px 2px #0a246a; }
  .smenu .who i { width: 40px; height: 40px; border: 2px solid #fff; border-radius: 4px; background: #111 url('/assets/aceforce-logo-lime-alpha.png') center/90% no-repeat; }
  .smenu .cols { display: grid; grid-template-columns: 1fr 1fr; }
  .smenu .cols > div { padding: 6px 0; }
  .smenu .cols > div + div { background: #d3e5fa; border-left: 1px solid #95bdee; }
  .smenu a, .smenu button.it { display: block; width: 100%; text-align: left; padding: 6px 12px; font: 12px Tahoma, sans-serif; color: #000; text-decoration: none; background: none; border: 0; cursor: pointer; }
  .smenu a:hover, .smenu button.it:hover { background: #316ac5; color: #fff; }
  .smenu .foot { display: flex; justify-content: flex-end; gap: 6px; padding: 6px 10px; background: linear-gradient(#1868ce, #0b4ab4); }
  .smenu .foot button { background: none; border: 0; color: #fff; font: 12px Tahoma, sans-serif; cursor: pointer; }
  /* balloon */
  .balloon { position: fixed; right: 8px; bottom: 40px; z-index: 5500; width: 260px; background: #ffffe1; border: 1px solid #000; border-radius: 8px; padding: 8px 10px; font-size: 11px; box-shadow: 2px 2px 6px rgba(0,0,0,.35); }
  .balloon b { display: block; margin-bottom: 3px; }
  .balloon button { position: absolute; right: 4px; top: 3px; border: 0; background: none; cursor: pointer; }
  .shutdown { position: fixed; inset: 0; z-index: 9500; background: #000; color: #f60; display: grid; place-items: center; text-align: center; font: bold 22px "Trebuchet MS", sans-serif; }
  .shutdown a { color: #f60; font-size: 14px; }
  @media (max-width: 700px) {
    .win { left: 0 !important; top: 0 !important; width: 100vw !important; height: calc(100vh - 32px) !important; border-radius: 0; }
    .explorer { grid-template-columns: 1fr; }
    .side { display: none; }
    .tray .clk { display: none; }
    .task { max-width: 90px; }
  }
</style>
</head>

      if (c.m) {
        over = true; clearInterval(timer); face.innerHTML = '&#128565;'; tone(110, 0, .5, 'sawtooth', .07);
        cells.forEach(function (x) { if (x.m) { x.b.classList.add('o'); x.b.textContent = '\u{1F4E6}'; } }); c.b.style.background = '#f33';
        msg.textContent = 'Stockout! Expedite fees incurred. Click the face to try again.'; return;
      }
      c.o = true; opened++; c.b.classList.add('o'); if (c.n) { c.b.textContent = c.n; c.b.style.color = COL[c.n]; } else nb(i).forEach(reveal);
      if (opened === N * N - M) { over = true; clearInterval(timer); face.innerHTML = '&#128526;'; ding(); msg.textContent = 'All SKUs in stock. Fill rate: 100%.'; }
    }
    function flag(i) { var c = cells[i]; if (c.o || over) return; c.f = !c.f; flags += c.f ? 1 : -1; c.b.textContent = c.f ? '\u{1F6A9}' : ''; left.textContent = pad(M - flags); }
    var press = null;
    gridEl.addEventListener('click', function (e) { var b = e.target.closest('.c'); if (!b) return; if (press === 'long') { press = null; return; } reveal(+b.dataset.i); });
    gridEl.addEventListener('contextmenu', function (e) { e.preventDefault(); var b = e.target.closest('.c'); if (b) flag(+b.dataset.i); });
    gridEl.addEventListener('pointerdown', function (e) { var b = e.target.closest('.c'); if (!b || e.pointerType === 'mouse') return; press = setTimeout(function () { flag(+b.dataset.i); press = 'long'; }, 450); });
    gridEl.addEventListener('pointerup', function () { if (press && press !== 'long') { clearTimeout(press); press = null; } });
    face.onclick = reset; reset();
  }

  // ---------- Systems folder ----------
  function initSystems(el) {
    var box = el.querySelector('#sysFiles'), cols = ['#2b6bc4', '#e8742a', '#3a9a5b', '#8a4fc2', '#c23b5a', '#1f8f9a', '#b8860b', '#555'];
    SYS.carts.forEach(function (s, i) { var a = document.createElement('a'); a.className = 'file'; a.href = s[0]; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<div class="g" style="background:' + cols[i % 8] + '"></div><span></span>'; a.querySelector('.g').textContent = s[1].replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase(); a.querySelector('span').textContent = s[1]; box.appendChild(a); });
    SYS.plain.forEach(function (s) { var d = document.createElement('div'); d.className = 'file'; d.innerHTML = '<div class="g" style="background:#999"></div><span></span>'; d.querySelector('.g').textContent = s[0].slice(0, 2).toUpperCase(); d.querySelector('span').textContent = s[0] + ' (' + s[1] + ')'; box.appendChild(d); });
  }

  // ---------- Recycle Bin ----------
  function initBin(el) { el.querySelector('[data-empty]').onclick = function () { var f = el.querySelector('[data-binfiles]'); if (!f.children.length) return; crumple(); f.innerHTML = '<p style="font-size:11px;color:#555">The spreadsheets are gone. Your systems talk to each other now.</p>'; }; }

  // ---------- Contact ----------
  function initMail(el) {
    var f = el.querySelector('[data-mail]'), st = el.querySelector('[data-st]');
    function v(k) { return f.querySelector('[data-f="' + k + '"]').value.trim(); }
    f.addEventListener('submit', function (e) {
      e.preventDefault(); if (f.querySelector('[name=botcheck]').checked) return;
      if (!v('name') || !/^\S+@\S+\.\S+$/.test(v('email')) || !v('msg')) { st.textContent = 'Please add your name, a valid email and a message.'; tone(220, 0, .2, 'square', .04); return; }
      st.textContent = 'Sending...';
      fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ access_key: '1d1154fd-1717-4f0b-ac02-65efcb247832', from_name: 'aceforce.group AceOS 2003', topic: 'AceOS 2003',
          subject: 'AceForce inquiry (AceOS 2003)' + (v('brand') ? ' from ' + v('brand') : ''), name: v('name'), email: v('email'), brand: v('brand'), message: v('msg') }) })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d.success) { st.textContent = 'Message sent. We will reply by email.'; ding(); f.reset(); } else st.textContent = 'That did not go through. Please email info@aceforce.group.'; })
        .catch(function () { st.textContent = 'That did not go through. Please email info@aceforce.group.'; });
    });
  }
})();
</script>
