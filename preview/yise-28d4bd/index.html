  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function decrypt(pw){
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256" }, km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(P.iv) }, key, b64(P.ct));
    return JSON.parse(new TextDecoder().decode(pt));

  function mount(app){

    document.getElementById("gate").remove();
    var root = document.getElementById("root"); root.innerHTML = app.html; root.hidden = false;
    new Function(app.js)();
  }
  async function tryOpen(pw, quiet){
    try { var app = await decrypt(pw); try { sessionStorage.setItem("yise-k", pw); } catch(e){} mount(app); return true; }

  document.getElementById("gateform").addEventListener("submit", async function(e){

    var b = document.getElementById("go"); b.disabled = true; b.textContent = "Opening...";
